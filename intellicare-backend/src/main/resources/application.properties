spring.application.name=IntelliCare

# Connection URL for SQL Server using the Microsoft JDBC driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate settings suitable for Microsoft SQL Server
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.hibernate.ddl-auto=update
# Physical naming strategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# MQTT broker connection URL
mqtt.broker.url=${MQTT_BROKER_URL:tcp://localhost:1883}
# MQTT topic for scale results
mqtt.topic.result=intellicare/scale/result

spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}

resend.api.key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

server.port=${PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true