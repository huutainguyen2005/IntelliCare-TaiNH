spring.application.name=IntelliCare-Workshop

# Ket noi PostgreSQL (Supabase) qua bien moi truong
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT - BAT BUOC set qua bien moi truong, KHONG co gia tri mac dinh
jwt.secret=${JWT_SECRET}

# Resend (gui email ket qua)
resend.api.key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# Device API Key (ESP32 goi /api/workshop/measurements/**)
device.api.key=${DEVICE_API_KEY}

# Can Xiaomi Mi Scale (BLE)
xiaomi.scale.mac=${XIAOMI_SCALE_MAC}
xiaomi.scale.bind-key=${XIAOMI_SCALE_BIND_KEY}

# Tai khoan Admin dau tien - CHI dung 1 lan luc khoi dong, xem
# AdminBootstrapRunner.java. Sau khi da tao xong 1 Admin trong DB, 2 bien
# nay khong con tac dung gi nua (co the xoa khoi bien moi truong sau do).
workshop.admin.bootstrap-username=${ADMIN_BOOTSTRAP_USERNAME:}
workshop.admin.bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:}

# CORS - doi thanh domain that truoc khi len production
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

server.port=${PORT:8081}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
